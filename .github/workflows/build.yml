name: Build and Push Antigravity RC Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          load: true
          tags: antigravity-rc:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test in non-root container with empty /home/dev
        run: |
          docker run --rm \
            --tmpfs /home/dev:uid=1000,gid=1000 \
            antigravity-rc:verify bash -lc '
              set -euo pipefail
              id
              ls -la ~/.gemini/GEMINI.md
              for cmd in agy coder mise uv python3 node npm kubectl kubelogin kubectl-oidc_login helm kustomize jq yq rg fd mtr dig gh git; do
                echo -n "$cmd -> "
                command -v "$cmd"
              done
              agy --version
              agy remote-control --help
              coder version
              mise --version
              uv --version
              kubectl version --client
              helm version --short
              kustomize version
            '

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
